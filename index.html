<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>K Perfect Days</title>
</head>
<body class="font-mono bg-gray-400">
    <div class="flex flex-col h-screen bg-red-400 content-center items-center">
        <div class="flex flex-col bg-red-200 h-5/8 w-full items-center justify-center">
            <label for="message" class="block mb-2.5 text-md">Tell us about your trip</label>
            <textarea id="message" class="bg-gray-200 text-sm rounded-md w-3/4 h-1/2 shadow-md p-3 placeholder:text-body" placeholder="I'm traveling to New York in December with a group of 3 and we enjoy fine dining, art..."></textarea>
        </div>
        <div class="flex bg-red-300 h-3/8 w-full">
            <div w-40 bg-red-200 h-40>Sign Up</div>
            <div>Log in</div>
        </div>
    </div>
</body>
</html>
